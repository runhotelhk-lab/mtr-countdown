<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>將軍澳資訊儀表板</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* MAIN TABS STYLING */
        .tab-bar {
            display: flex;
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 4px;
            border: 1px solid #333;
            width: 100%;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            color: #a0a0a0;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: #00e676;
            color: #121212;
        }

        /* SUB TABS STYLING */
        .sub-tab-bar {
            display: flex;
            background-color: #2a2a2a;
            border-radius: 20px;
            padding: 3px;
            border: 1px solid #444;
            width: 100%;
            margin-bottom: 4px;
        }

        .sub-tab-btn {
            flex: 1;
            padding: 6px 0;
            background: none;
            border: none;
            color: #888888;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sub-tab-btn.active {
            background-color: #ffffff;
            color: #121212;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .tab-content.active {
            display: flex;
        }

        /* CARD STYLING */
        .card {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 24px 20px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            position: relative;
        }

        .station-label {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .minutes-container {
            margin: 12px 0 8px 0;
        }

        .minutes-number {
            font-size: 4.2rem;
            font-weight: 800;
            color: #00e676;
            line-height: 1;
        }

        .dest-tag {
            font-size: 2.8rem;
            font-weight: 800;
            color: #00e676;
            display: block;
            margin-bottom: 4px;
        }

        .minutes-unit {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            margin-top: 6px;
            margin-bottom: 12px;
        }

        .next-next-train {
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .dest-badge {
            color: #00e676;
            font-weight: bold;
        }

        /* TRAFFIC CAMERA STYLING */
        .cam-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #333;
            text-align: left;
        }

        .cam-title {
            font-size: 0.85rem;
            color: #dddddd;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .cam-img-wrap {
            width: 100%;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4/3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cam-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* CONTROL & FOOTER */
        .update-time {
            font-size: 0.85rem;
            color: #757575;
            margin-top: 8px;
        }

        .countdown-label {
            font-size: 0.8rem;
            color: #00e676;
            margin-top: 4px;
        }

        .refresh-btn {
            margin-top: 12px;
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 24px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .refresh-btn:active {
            background-color: #555;
        }

        .version-tag {
            font-size: 0.7rem;
            color: #444444;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- MAIN NAVIGATION TABS -->
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchMainTab('mtr')">鐵路到站時間</button>
            <button class="tab-btn" onclick="switchMainTab('cctv')">交通快拍圖像</button>
        </div>

        <!-- TAB 1: MTR SCHEDULE -->
        <div id="tab-mtr" class="tab-content active">
            <!-- CARD 1: LOHAS PARK -->
            <div class="card">
                <div class="station-label">康城站 下一班車</div>
                <div class="minutes-container">
                    <span class="station-label">仲有</span>
                    <div id="lhp-minutes" class="minutes-number">--</div>
                    <div class="minutes-unit">分鐘到站</div>
                </div>
                <div class="station-label next-next-train">
                    再下一班車還有 <span id="lhp-next-minutes" style="color: #ffffff;">--</span> 分鐘到達
                </div>
            </div>

            <!-- CARD 2: TSEUNG KWAN O -->
            <div class="card">
                <div class="station-label">將軍澳站 下一班車</div>
                <div class="minutes-container">
                    <span id="tko-dest" class="dest-tag">--</span>
                    <span class="station-label">仲有</span>
                    <div id="tko-minutes" class="minutes-number">--</div>
                    <div class="minutes-unit">分鐘到站</div>
                </div>
                <div class="station-label next-next-train">
                    再下一班 (<span id="tko-next-dest" class="dest-badge">--</span>) 還有 <span id="tko-next-minutes" style="color: #ffffff;">--</span> 分鐘到達
                </div>
            </div>
        </div>

        <!-- TAB 2: TRAFFIC SNAPSHOT CAMERAS -->
        <div id="tab-cctv" class="tab-content">
            <!-- SUB TABS -->
            <div class="sub-tab-bar">
                <button class="sub-tab-btn active" onclick="switchSubTab('outbound')">出去</button>
                <button class="sub-tab-btn" onclick="switchSubTab('homebound')">返屋企</button>
                <button class="sub-tab-btn" onclick="switchSubTab('crossharbour')">過海</button>
            </div>

            <!-- CCTV CONTAINER -->
            <div id="cctv-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>

        <!-- CONTROL & STATUS (SHARED) -->
        <div style="width: 100%;">
            <div id="update-time" class="update-time">(更新時間: --:--:--)</div>
            <div id="countdown" class="countdown-label">5 秒後自動更新</div>
            <button class="refresh-btn" onclick="manualRefresh()">手動刷新</button>
            <div class="version-tag">v1.3.0</div>
        </div>

    </div>

    <script>
        let currentMainTab = 'mtr';
        let currentSubTab = 'outbound';
        let countdownValue = 5;
        let timerInterval = null;

        // Custom categorized CCTV cameras
        const cctvGroups = {
            outbound: [
                { key: 'TK701F', name: '跨灣大橋近日出康城 [TK701F]' },
                { key: 'AID07104', name: '將軍澳隧道公路近將軍澳隧道入口 - 西行 [AID07104]' },
                { key: 'AID07103', name: '將軍澳隧道公路近將軍澳電話機房 - 西行 [AID07103]' },
                { key: 'AID07101', name: '環保大道近蓬萊路 - 西行 [AID07101]' },
                { key: 'AID07106', name: '將軍澳道近將軍澳道變電站 - 西行 [AID07106]' },
                { key: 'AID02108', name: '觀塘繞道近觀塘碼頭 - 北行 [AID02108]' },
                { key: 'AID02111', name: '觀塘繞道近九龍貨倉 - 北行 [AID02111]' }
            ],
            homebound: [
                { key: 'AID02208', name: '觀塘繞道近九龍貨倉 - 南行 [AID02208]' },
                { key: 'AID02211', name: '觀塘繞道近觀塘碼頭 - 東行 [AID02211]' },
                { key: 'AID07230', name: '將軍澳隧道公路近寶康公園 - 東行 [AID07230]' },
                { key: 'AID07232', name: '環保大道近昭信路 - 東行 [AID07232]' }
            ],
            crossharbour: [
                { key: 'K952F', name: '東區海底隧道九龍入口 [K952F]' }
            ]
        };

        const stationNames = { 'POA': '寶琳', 'LHP': '康城', 'TIK': '調景嶺', 'NOP': '北角' };

        // MAIN TAB SWITCHER
        function switchMainTab(tabName) {
            currentMainTab = tabName;
            document.querySelectorAll('.tab-bar .tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'mtr') {
                document.querySelectorAll('.tab-bar .tab-btn')[0].classList.add('active');
                document.getElementById('tab-mtr').classList.add('active');
            } else {
                document.querySelectorAll('.tab-bar .tab-btn')[1].classList.add('active');
                document.getElementById('tab-cctv').classList.add('active');
                renderCCTVImages();
            }
        }

        // SUB TAB SWITCHER
        function switchSubTab(groupKey) {
            currentSubTab = groupKey;
            
            const btnIndex = groupKey === 'outbound' ? 0 : (groupKey === 'homebound' ? 1 : 2);
            document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.sub-tab-btn')[btnIndex].classList.add('active');

            renderCCTVImages();
        }

        // RENDER CCTV SNAPSHOTS
        function renderCCTVImages() {
            const container = document.getElementById('cctv-list');
            const ts = new Date().getTime(); // timestamp to prevent caching
            const cameras = cctvGroups[currentSubTab] || [];
            
            container.innerHTML = cameras.map(cam => `
                <div class="cam-card">
                    <div class="cam-title">${cam.name}</div>
                    <div class="cam-img-wrap">
                        <img class="cam-img" src="https://tdcctv.data.one.gov.hk/${cam.key}.JPG?_=${ts}" alt="${cam.name}" loading="lazy" onerror="this.src='https://tdcctv.data.one.gov.hk/image?key=${cam.key}&_=${ts}'" />
                    </div>
                </div>
            `).join('');
        }

        // FETCH MTR DATA
        async function fetchMTRData() {
            try {
                const resLHP = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=LHP&_=' + new Date().getTime());
                const dataLHP = await resLHP.json();

                if (dataLHP.status === 1 && dataLHP.data['TKL-LHP']) {
                    const lhpData = dataLHP.data['TKL-LHP'];
                    const trains = lhpData.UP || lhpData.DOWN || [];
                    document.getElementById('lhp-minutes').textContent = trains[0] ? trains[0].ttnt : '0';
                    document.getElementById('lhp-next-minutes').textContent = trains[1] ? trains[1].ttnt : '--';
                }
            } catch (e) {
                console.error('LHP Error:', e);
                document.getElementById('lhp-minutes').textContent = 'Err';
            }

            try {
                const resTKO = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=TKO&_=' + new Date().getTime());
                const dataTKO = await resTKO.json();

                if (dataTKO.status === 1 && dataTKO.data['TKL-TKO']) {
                    const tkoData = dataTKO.data['TKL-TKO'];
                    const allTrains = [...(tkoData.UP || []), ...(tkoData.DOWN || [])];
                    const filteredTrains = allTrains.filter(t => t.dest === 'POA' || t.dest === 'LHP');

                    if (filteredTrains.length > 0) {
                        const firstTrain = filteredTrains[0];
                        document.getElementById('tko-dest').textContent = stationNames[firstTrain.dest] || firstTrain.dest;
                        document.getElementById('tko-minutes').textContent = firstTrain.ttnt;

                        const secondTrain = filteredTrains[1];
                        if (secondTrain) {
                            document.getElementById('tko-next-dest').textContent = stationNames[secondTrain.dest] || secondTrain.dest;
                            document.getElementById('tko-next-minutes').textContent = secondTrain.ttnt;
                        } else {
                            document.getElementById('tko-next-dest').textContent = '--';
                            document.getElementById('tko-next-minutes').textContent = '--';
                        }
                    } else {
                        document.getElementById('tko-dest').textContent = '--';
                        document.getElementById('tko-minutes').textContent = '--';
                    }
                }
            } catch (e) {
                console.error('TKO Error:', e);
                document.getElementById('tko-minutes').textContent = 'Err';
            }
        }

        function refreshAllData() {
            if (currentMainTab === 'mtr') {
                fetchMTRData();
            } else {
                renderCCTVImages();
            }
            const now = new Date();
            document.getElementById('update-time').textContent = `(更新時間: ${now.toTimeString().split(' ')[0]})`;
        }

        function startCountdown() {
            const countdownEl = document.getElementById('countdown');
            countdownValue = 5;
            
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                countdownValue--;
                if (countdownValue <= 0) {
                    countdownEl.textContent = '正在更新...';
                    refreshAllData();
                    countdownValue = 5;
                } else {
                    countdownEl.textContent = `${countdownValue} 秒後自動更新`;
                }
            }, 1000);
        }

        function manualRefresh() {
            refreshAllData();
            startCountdown();
        }

        // Run on load
        refreshAllData();
        startCountdown();
    </script>
</body>
</html>
