<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>康城站實時列車</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .card {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            position: relative;
        }

        .station-label {
            font-size: 1.25rem;
            color: #a0a0a0;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .minutes-container {
            margin: 20px 0 10px 0;
        }

        .minutes-number {
            font-size: 5rem;
            font-weight: 800;
            color: #00e676;
            line-height: 1;
        }

        .minutes-unit {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .next-next-train {
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .update-time {
            font-size: 0.9rem;
            color: #757575;
            margin-top: 24px;
        }

        .countdown-label {
            font-size: 0.8rem;
            color: #00e676;
            margin-top: 8px;
        }

        .refresh-btn {
            margin-top: 16px;
            background-color: #333;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 24px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .refresh-btn:active {
            background-color: #555;
        }

        /* Small version tag at bottom */
        .version-tag {
            font-size: 0.7rem;
            color: #444444;
            margin-top: 20px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="station-label">康城站 下一班車</div>
        
        <div class="minutes-container">
            <span class="station-label">仲有</span>
            <div id="minutes" class="minutes-number">--</div>
            <div class="minutes-unit">分鐘到站</div>
        </div>

        <!-- Next Next Train Section -->
        <div class="station-label next-next-train">
            再下一班車還有 <span id="next-minutes" style="color: #ffffff;">--</span> 分鐘到達
        </div>

        <div id="update-time" class="update-time">(更新時間: --:--:--)</div>
        <div id="countdown" class="countdown-label">5 秒後自動更新</div>

        <button class="refresh-btn" onclick="manualRefresh()">手動刷新</button>

        <!-- Version Label -->
        <div class="version-tag">v1.0.1</div>
    </div>

    <script>
        let countdownValue = 5;
        let timerInterval = null;

        async function fetchMTRData() {
            const minutesEl = document.getElementById('minutes');
            const nextMinutesEl = document.getElementById('next-minutes');
            const updateTimeEl = document.getElementById('update-time');

            try {
                // Fetch live MTR API with timestamp to bypass local caching
                const response = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=LHP&_=' + new Date().getTime());
                const data = await response.json();

                if (data.status === 1 && data.data['TKL-LHP']) {
                    const lhpData = data.data['TKL-LHP'];
                    // LOHAS Park departures are under UP or DOWN depending on destination
                    const trains = lhpData.UP || lhpData.DOWN || [];
                    
                    if (trains.length > 0) {
                        // 1st Train
                        const firstTrain = trains[0];
                        minutesEl.textContent = firstTrain ? firstTrain.ttnt : '0';

                        // 2nd Train (seq 2)
                        const secondTrain = trains[1];
                        nextMinutesEl.textContent = secondTrain ? secondTrain.ttnt : '--';
                    } else {
                        minutesEl.textContent = '--';
                        nextMinutesEl.textContent = '--';
                    }
                    
                    const now = new Date();
                    const timeString = now.toTimeString().split(' ')[0];
                    updateTimeEl.textContent = `(更新時間: ${timeString})`;
                } else {
                    minutesEl.textContent = '?';
                    nextMinutesEl.textContent = '?';
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                minutesEl.textContent = 'Err';
                nextMinutesEl.textContent = 'Err';
            }
        }

        function startCountdown() {
            const countdownEl = document.getElementById('countdown');
            countdownValue = 5;
            
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                countdownValue--;
                if (countdownValue <= 0) {
                    countdownEl.textContent = '正在更新...';
                    fetchMTRData();
                    countdownValue = 5;
                } else {
                    countdownEl.textContent = `${countdownValue} 秒後自動更新`;
                }
            }, 1000);
        }

        function manualRefresh() {
            fetchMTRData();
            startCountdown(); // Reset timer on manual tap
        }

        // Run immediately on page load
        fetchMTRData();
        startCountdown();
    </script>
</body>
</html>
